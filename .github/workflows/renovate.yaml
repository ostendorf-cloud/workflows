name: renovate

# Thin, per-repository trigger for this repository's own Renovate run.
# Calls "reusable-renovate.yaml" (dogfooding: this is the first and, so
# far, only caller), replacing the old central, org-wide autodiscover
# workflow issue #28 retired. That old workflow ran one job against every
# repository the ostendorf-cloud-dependencies GitHub App is installed on,
# triggered only by "schedule"/"workflow_dispatch". This workflow instead
# runs Renovate for just this repository, from this repository's own
# triggers.
#
# The "issues"/"pull_request" "edited" triggers below exist so that a
# human checking a Renovate rebase checkbox reacts within this run's CI
# time, instead of waiting for the next "schedule" tick. Checking that
# checkbox edits the Dependency Dashboard issue body (for a repository-wide
# rebase) or a Renovate pull request's own body (for a single PR), which
# GitHub reports as an "issues"/"pull_request" "edited" event. The old
# org-wide workflow could never react to that edit at all: a single GitHub
# App installation spanning many repositories has no way to subscribe to a
# same-repository "issues"/"pull_request" event belonging to one specific
# repository out of all of them, because the event is native to the
# repository it happens in, not to the app installation. A per-repository
# caller workflow like this one can, because the event now belongs to the
# very repository the workflow file lives in.
on:
  # Unchanged from the retired workflow.
  schedule:
    - cron: "17 3 * * *"
  # No inputs here: "runs-on-runner" now lives on "reusable-renovate.yaml"'s
  # own "workflow_call" input instead, with its own default. Keeping this
  # trigger input-free keeps the "with:" below simple; forwarding a runner
  # choice through a "workflow_dispatch" input is possible but is not
  # needed for this repository's own use.
  workflow_dispatch:
  issues:
    types: [edited]
  pull_request:
    types: [edited]

# "contents: read" is enough for this caller: the "if:" below only reads
# event payload fields, which needs no permission at all, and the actual
# Renovate run's permissions come from the token "reusable-renovate.yaml"
# mints for itself, not from this workflow's own GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  renovate:
    name: Call reusable-renovate
    # Gates the whole job, rather than something inside
    # "reusable-renovate.yaml": that reusable workflow has no way to know
    # what "Dependency Dashboard" or "authored by the dependencies bot"
    # means for an arbitrary caller. Deciding WHEN to call it is this
    # entire local workflow's only job, so a job-level "if:" is the
    # natural place for that decision.
    #
    # What fires:
    #   - every "schedule" tick;
    #   - every manual "workflow_dispatch";
    #   - an "issues"/"pull_request" "edited" event, but only when BOTH of:
    #     (a) the issue is the Dependency Dashboard, or the pull request is
    #         authored by the dependencies bot, AND
    #     (b) the edit's sender is NOT the dependencies bot itself.
    #
    # What does NOT fire:
    #   - Renovate's own edit of the Dependency Dashboard issue body or of
    #     one of its own pull request bodies during a normal run. Every
    #     such edit carries "github.event.sender.login" ==
    #     "ostendorf-cloud-dependencies[bot]" (the dependencies bot is the
    #     one making the edit), so condition (b) above excludes it. This is
    #     the load-bearing anti-loop guard: without it, this workflow would
    #     retrigger itself on every one of its own runs that touches either
    #     body, forever.
    #   - any edit, by any actor, to an issue that is not the Dependency
    #     Dashboard or a pull request not authored by the dependencies bot:
    #     condition (a) excludes it.
    #
    # The Dependency Dashboard issue has no stable issue number to check
    # ahead of time in a static workflow file, and Renovate assigns it no
    # guaranteed label either, so this condition matches on
    # "github.event.issue.title == 'Dependency Dashboard'" instead:
    # Renovate's own documented default title for that issue
    # (docs.renovatebot.com, "dependencyDashboard.title", default
    # "Dependency Dashboard"). A repository that ever configures a custom
    # dashboard title would need this condition updated to match; this
    # repository does not.
    #
    # Property access on a context field that does not exist for the
    # current event (for example "github.event.issue" on a "schedule" or
    # "pull_request" event) evaluates to null rather than failing the
    # expression, so each side of the "||"/"&&" below is safe to evaluate
    # regardless of which event triggered this run.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.sender.login != 'ostendorf-cloud-dependencies[bot]' &&
        (
          github.event.issue.title == 'Dependency Dashboard' ||
          github.event.pull_request.user.login == 'ostendorf-cloud-dependencies[bot]'
        )
      )
    uses: ./.github/workflows/reusable-renovate.yaml
    secrets: inherit
