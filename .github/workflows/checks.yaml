name: checks

# "ready_for_review" is on top of the three default pull_request types
# (opened, synchronize, reopened), not instead of them: specifying
# "types:" at all replaces the default list rather than adding to it.
# Without it, this workflow would never run again once a draft pull
# request against this very repository is marked ready, the same gap
# "reusable-checks.yaml" documents for every other caller.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  # Dogfooding: runs this repository's own checks through the same
  # reusable workflow it publishes for every other repository to call,
  # the same local "uses:" self-call "dco.yaml" and "renovate.yaml"
  # already use for "reusable-dco.yaml" and "reusable-renovate.yaml".
  # Concurrency, draft gating and path filtering all now live in
  # "reusable-checks.yaml" itself, not here.
  checks:
    uses: ./.github/workflows/reusable-checks.yaml
    with:
      checks: |
        [
          {"task": "lint:actions", "paths": [".github/workflows/*"]},
          {"task": "lint:yaml", "paths": ["*.yaml", "*.yml"]},
          {"task": "lint:markdown", "paths": ["*.md", ".markdownlint-cli2.jsonc"]},
          {"task": "lint:secrets"},
          {"task": "lint:shell", "paths": ["scripts/*"]},
          {"task": "lint:license", "paths": ["scripts/*"]},
          {"task": "test:shell", "paths": ["scripts/*"]}
        ]

  # Dogfooding: validates this repository's own renovate.json with the
  # same reusable workflow it publishes for every other repository to
  # call, the same local "uses:" self-call "dco.yaml" and "renovate.yaml"
  # already use for "reusable-dco.yaml" and "reusable-renovate.yaml".
  # Before this job existed, nothing in this repository ever ran
  # "reusable-renovate-config.yaml" on itself, which is why a Node
  # version bug in it reached four consumer repositories before this
  # repository's own CI caught anything.
  renovate-config:
    uses: ./.github/workflows/reusable-renovate-config.yaml
