version: "3"

tasks:
  setup:
    desc: Install the pinned toolchain
    cmds:
      - mise trust
      - mise install

  lint:actions:
    desc: GitHub Actions workflow lint
    cmds:
      - actionlint

  lint:yaml:
    desc: YAML lint
    cmds:
      - yamllint .

  lint:markdown:
    desc: Markdown lint
    cmds:
      - markdownlint-cli2 "**/*.md"

  lint:secrets:
    desc: Secret scan over the git history
    cmds:
      - gitleaks git --no-banner --redact

  check:
    desc: Every check, one after another
    cmds:
      - task: lint:actions
      - task: lint:yaml
      - task: lint:markdown
      - task: lint:secrets
