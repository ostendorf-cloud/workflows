name: reusable-license

# Checks that every source file a caller cares about carries a license
# header, using addlicense in "-check" mode: it only reports a missing
# header, it never adds or rewrites one.
#
# Generalises the "lint:license" target that release-me and web-kit each
# run from their own Taskfile.yaml, with the same tool and the same flags,
# but different files to check. Rather than inventing a glob mini-language
# that still could not express an arbitrary "find" expression (different
# directories, name and type predicates, exclusions), a caller supplies one
# or more complete "find" invocations and this workflow runs each of them
# and checks the union of their output.
#
# Inputs:
#   runs-on-runner: the runner label the job runs on, default
#     ubuntu-latest. A typed input rather than a hardcoded "ubuntu-latest",
#     because different consuming repositories may want a different
#     runner (self-hosted, a different OS, a different size), and
#     hardcoding one would force every consumer onto the same choice
#     forever.
#
#   license-type: the license identifier passed to addlicense's "-l" flag.
#     Optional. When neither license-type nor license-file is set, the job
#     uses "apache". The default is applied inside the step and not in the
#     input, because a default in the input would make an explicit
#     license-type indistinguishable from none, and the job could not
#     reject a caller that sets both. Mutually exclusive with license-file.
#
#   license-file: path to a license header template, relative to the
#     repository root, passed to addlicense's "-f" flag. Optional, for a
#     repository whose header is not one of addlicense's built-in
#     templates. Mutually exclusive with license-type: setting both fails
#     the job at once. A file that does not exist fails the job and is
#     named. Use the same file the repository's own license lint target
#     passes to addlicense, so CI and local check the same thing.
#
#   What "-check" verifies: only that the word "copyright" or an SPDX
#   identifier appears near the top of each file (case insensitive, first
#   1000 bytes). It verifies neither which license the header names nor
#   the copyright holder. Measured with addlicense 1.2.0: a file carrying
#   "SPDX-License-Identifier: Apache-2.0" checked against an Elastic-2.0
#   header file exits 0, and a file with no header exits 1. Neither
#   license-type nor license-file therefore guarantees that a header names
#   the repository's license. Such a comparison is a different check and
#   belongs in the calling repository.
#
#   copyright-holder: the name passed to addlicense's "-c" flag. Required,
#     with no default: it varies per caller and a hardcoded default would
#     silently stamp the wrong name on a repository that forgot to set it.
#
#   year: the year passed to addlicense's "-y" flag. Required, with no
#     default: it changes over time, and a stale default would go
#     unnoticed by a caller that forgot to set it.
#
#   find-commands: one or more complete shell "find" invocations, one per
#     line. Each line's stdout is a newline-separated list of files; every
#     file from every line is checked together. Required: there is no
#     sensible default file set for an arbitrary repository. The job fails
#     when a command exits non zero. Each command runs under "set -eo
#     pipefail", so a failing stage of a pipeline counts and so does a
#     failing step inside a loop, such as a "mkdir" or "cp" before the
#     final "echo". The job also fails when a printed path is not a regular
#     file after all commands have ended, so a command may create the files
#     it prints. It logs how many files it passes to addlicense, and which.
#
#   addlicense-version: the version of addlicense mise installs, default
#     "1.2.0". Pinned here, inside this reusable workflow, through an
#     inline mise.toml passed to jdx/mise-action's "mise_toml" input, so
#     the check runs on a known version regardless of whether the calling
#     repository's own mise.toml pins addlicense at all.
on:
  workflow_call:
    inputs:
      runs-on-runner:
        description: Runner label the license check runs on.
        type: string
        default: ubuntu-latest
      license-type:
        description: >-
          License identifier passed to addlicense's "-l" flag. Defaults to apache when
          license-file is not set either. Mutually exclusive with license-file.
        type: string
        default: ""
      license-file:
        description: >-
          Path to a license header template passed to addlicense's "-f" flag. Mutually
          exclusive with license-type.
        type: string
        default: ""
      copyright-holder:
        description: Copyright holder name passed to addlicense's "-c" flag.
        type: string
        required: true
      year:
        description: Year passed to addlicense's "-y" flag.
        type: string
        required: true
      find-commands:
        description: >-
          One or more complete shell "find" invocations, one per line. Every file every
          invocation finds is checked together.
        type: string
        required: true
      addlicense-version:
        description: Version of addlicense mise installs.
        type: string
        default: "1.2.0"

permissions:
  contents: read

jobs:
  license:
    name: License headers
    runs-on: ${{ inputs.runs-on-runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Pins addlicense through an inline mise.toml independent of whatever
      # the calling repository's own mise.toml does or does not pin.
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a  # v5.2.10
        with:
          mise_toml: |
            [tools]
            "aqua:google/addlicense" = "${{ inputs.addlicense-version }}"

      - name: Check license headers
        env:
          COPYRIGHT_HOLDER: ${{ inputs.copyright-holder }}
          YEAR: ${{ inputs.year }}
          LICENSE_TYPE: ${{ inputs.license-type }}
          LICENSE_FILE: ${{ inputs.license-file }}
          FIND_COMMANDS: ${{ inputs.find-commands }}
        run: |
          # The template is either a built-in one (-l) or a file (-f), never
          # both. Neither set keeps the former default, apache.
          if [ -n "${LICENSE_TYPE}" ] && [ -n "${LICENSE_FILE}" ]; then
            echo "license-type and license-file are both set, they exclude each other: set only one of them" >&2
            exit 1
          fi
          if [ -n "${LICENSE_FILE}" ]; then
            if [ ! -f "${LICENSE_FILE}" ]; then
              echo "license-file is not a regular file: ${LICENSE_FILE}" >&2
              exit 1
            fi
            # No -s=only here: addlicense 1.2.0 ignores -f when -s=only is
            # set and never reads the file. Without it, addlicense reads
            # the file and fails on one it cannot read.
            template=(-f "${LICENSE_FILE}")
          else
            template=(-l "${LICENSE_TYPE:-apache}" -s=only)
          fi

          # Fails closed. Each command's output and exit status are captured
          # on their own: a process substitution would drop the status, and
          # addlicense exits 0 on a path that does not exist. Each command
          # runs with -e and pipefail, because a loop's status is the status
          # of its last command and would hide an earlier failure. The test
          # scripts/reusable-license_test.sh runs this very block.
          files=()
          failed=0
          while IFS= read -r cmd; do
            [ -z "${cmd}" ] && continue
            status=0
            out="$(bash -c "set -eo pipefail; ${cmd}" </dev/null)" || status=$?
            if [ "${status}" -ne 0 ]; then
              echo "find command failed with exit status ${status}: ${cmd}" >&2
              failed=1
              continue
            fi
            while IFS= read -r file; do
              [ -z "${file}" ] && continue
              files+=("${file}")
            done <<<"${out}"
          done <<<"${FIND_COMMANDS}"

          if [ "${failed}" -ne 0 ]; then
            echo "at least one find command failed, see above" >&2
            exit 1
          fi

          # A listed path has to be a regular file after all commands have
          # ended, so a command may create the files it prints.
          for file in "${files[@]}"; do
            if [ ! -f "${file}" ]; then
              echo "not a regular file: ${file}" >&2
              failed=1
            fi
          done

          if [ "${failed}" -ne 0 ]; then
            echo "at least one listed path is not a regular file, see above" >&2
            exit 1
          fi

          if [ "${#files[@]}" -eq 0 ]; then
            echo "no files matched any of the configured find-commands" >&2
            exit 1
          fi

          echo "passing ${#files[@]} file(s) to addlicense"
          printf '  %s\n' "${files[@]}"

          addlicense -check -c "${COPYRIGHT_HOLDER}" -y "${YEAR}" "${template[@]}" \
            -- "${files[@]}"
