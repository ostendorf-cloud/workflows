name: reusable-dco

# Checks that every commit in a pull request carries a Developer
# Certificate of Origin sign-off, and publishes the result as a check run
# owned by this organisation's own ostendorf-cloud-security GitHub App
# instead of github-actions[bot].
#
# Meant to be called from a caller's own "pull_request" trigger: this
# workflow supplies no trigger of its own, the calling workflow's
# "pull_request" event context (github.event.pull_request.*) is what the
# steps below read.
#
# The job checks out this repository's own commit into "workflow-source"
# and reads no files from the caller. The pull request commits it checks
# come from the GitHub API, not from a checkout of the caller's code.
#
# Inputs:
#   runs-on-runner: the runner label the job runs on, default
#     ubuntu-latest. A typed input rather than a hardcoded "ubuntu-latest",
#     because different consuming repositories may want a different
#     runner (self-hosted, a different OS, a different size), and
#     hardcoding one would force every consumer onto the same choice
#     forever.
#
# Secrets:
#   GITHUB_TOKEN is used for the pull request commits read and the
#   "fail the job" step. It is automatically available in a called
#   reusable workflow with no declaration and no "secrets: inherit",
#   so it needs none here.
#
#   vars.GH_APP_SECURITY_APP_ID, the security app's app id, is a
#   repository or organisation level variable, also automatically
#   available in a called reusable workflow with no declaration, so it
#   needs none here either.
#
#   Only the app's private key is a secret, and a secret is not
#   auto-inherited by a called workflow unless the caller passes it or
#   uses "secrets: inherit". It is still declared below even though every
#   caller is expected to use "secrets: inherit", so the contract this
#   workflow needs is documented rather than implicit. Its name matches
#   the organisation's own secret name exactly, so "secrets: inherit"
#   populates it with no remapping.
on:
  workflow_call:
    inputs:
      runs-on-runner:
        description: Runner label the DCO check runs on.
        type: string
        default: ubuntu-latest
    secrets:
      GH_APP_SECURITY_PRIVATE_KEY:
        description: >-
          Private key of the organisation's security GitHub App (ostendorf-cloud-security),
          used to mint a token that publishes the verdict as a check run. Optional: a caller
          without it (or a pull request from a fork) still gets the enforcement, through this
          job's own pass/fail status, just no check run.
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  signoff:
    name: Every commit carries a DCO sign-off
    runs-on: ${{ inputs.runs-on-runner }}
    timeout-minutes: 10
    # Every "run" step below executes inside this repository's own
    # checkout, so mise resolves the tools pinned in its "mise.toml" and
    # the script below is a plain relative path. "RUNNER_TEMP",
    # "GITHUB_OUTPUT" and "GITHUB_STEP_SUMMARY" are absolute paths, so
    # this default does not affect them.
    defaults:
      run:
        working-directory: workflow-source
    steps:
      # The exact commit this job's own workflow file was resolved to is
      # read from the "job" context as JSON, rather than written
      # straight into a step's "with:" as "job.workflow_sha", because
      # actionlint 1.7.12, the newest release, does not yet know the
      # "job.workflow_repository" and "job.workflow_sha" properties exist
      # (rhysd/actionlint#705). That is a lint gap, not a doubt about the
      # fields: GitHub documents both as part of the job context. Reading
      # the context as JSON with jq sidesteps the gap without silencing
      # actionlint anywhere in this file.
      #
      # "job.workflow_repository" and "job.workflow_sha" name the
      # repository and the commit of the workflow file that defines this
      # job, which is this file, at the ref the caller pinned. The
      # "github" context describes the CALLER instead, which is why a
      # bare checkout further down would check out the caller's
      # repository, not this one.
      #
      # Both values are validated before use, so an empty or malformed
      # one fails this job outright instead of letting the checkout step
      # below silently fall back to a default branch.
      #
      # "working-directory" overrides the job's own default of
      # "workflow-source": that directory does not exist yet, the
      # checkout below is what creates it. "jq" is read from the runner
      # image here, the same way the later steps' "gh" CLI is, because
      # this repository's own pinned toolchain is only available once the
      # checkout below has run.
      - name: Resolve this workflow's own repository and commit
        id: source
        working-directory: ${{ github.workspace }}
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq is required on the runner but is not installed" >&2
            exit 1
          fi

          repository="$(printf '%s' "${JOB_CONTEXT}" |
            jq -r '.workflow_repository // ""')"
          sha="$(printf '%s' "${JOB_CONTEXT}" | jq -r '.workflow_sha // ""')"

          case "${repository}" in
          */*) ;;
          *)
            echo "job.workflow_repository is not an owner/repository:" \
              "'${repository}'" >&2
            exit 1
            ;;
          esac

          case "${sha}" in
          "" | *[!0-9a-f]*)
            echo "job.workflow_sha is not a commit SHA: '${sha}'" >&2
            exit 1
            ;;
          esac

          if [ "${#sha}" -ne 40 ]; then
            echo "job.workflow_sha is not a 40 character commit SHA:" \
              "'${sha}'" >&2
            exit 1
          fi

          echo "repository=${repository}" >>"${GITHUB_OUTPUT}"
          echo "sha=${sha}" >>"${GITHUB_OUTPUT}"

      # This job never checks out the caller's repository: nothing below
      # reads the caller's files, the pull request commits come from the
      # "gh api" call further down. This step checks out this workflow's
      # own repository instead, into "workflow-source", pinned to the
      # exact commit the previous step resolved, and every "run" step
      # below defaults to that directory.
      #
      # Pinning to that exact commit, rather than a branch or tag name,
      # matters because it is the commit the caller's own
      # "uses: ...@<ref>" resolved to. A caller pinned to a released tag
      # then runs that tag's script, never whatever sits on "main" when
      # the job happens to run, and a tag moved after the caller resolved
      # it cannot change what an already-resolved run executes.
      #
      # "persist-credentials: false" because no step below runs an
      # authenticated git command; only "gh api" talks to GitHub.
      - name: Check out this workflow's own repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.sha }}
          path: workflow-source
          persist-credentials: false

      # "working_directory" points mise at this repository's own
      # mise.toml, which pins "jq", instead of the workspace root, which
      # now holds nothing but the "workflow-source" checkout above.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
        with:
          working_directory: workflow-source

      # The pull request commits endpoint, not git log against the merge
      # base: scripts/check-dco.sh explains why. It is read with
      # GITHUB_TOKEN, scoped read only above, so the app's token is
      # minted for the one write this workflow makes.
      - name: Check the sign-off of every commit in the pull request
        id: dco
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DCO_EXPECTED_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/commits" \
            >"${RUNNER_TEMP}/commits.json"

          code=0
          DCO_REPORT="${RUNNER_TEMP}/dco.md" ./scripts/check-dco.sh \
            "${RUNNER_TEMP}/commits.json" || code=$?

          # A failing sign-off is reported, not raised here: the job's own
          # failure comes from the last step, after the check run is
          # published. Any other exit code means the check itself is
          # broken, which stops the job right away, before the report is
          # read, rather than being published as a verdict about the pull
          # request.
          case "${code}" in
          0) conclusion=success ;;
          1) conclusion=failure ;;
          *) exit "${code}" ;;
          esac

          cat "${RUNNER_TEMP}/dco.md" >>"${GITHUB_STEP_SUMMARY}"
          echo "conclusion=${conclusion}" >>"${GITHUB_OUTPUT}"

      # The secrets context cannot be read in a job or step "if", so the
      # presence of the app's credentials is turned into a step output
      # first. Only emptiness is tested, nothing is printed.
      - name: Check whether the security app credentials are available
        id: credentials
        env:
          APP_ID: ${{ vars.GH_APP_SECURITY_APP_ID }}
          PRIVATE_KEY: ${{ secrets.GH_APP_SECURITY_PRIVATE_KEY }}
        run: |
          if [ -n "${APP_ID}" ] && [ -n "${PRIVATE_KEY}" ]; then
            echo "available=true" >>"${GITHUB_OUTPUT}"
          else
            echo "available=false" >>"${GITHUB_OUTPUT}"
            echo "GH_APP_SECURITY_APP_ID or GH_APP_SECURITY_PRIVATE_KEY is" \
              "unset, which is also the case for a pull request from a" \
              "fork: no check run is published, this job's status carries" \
              "the verdict." >>"${GITHUB_STEP_SUMMARY}"
          fi

      # The token is scoped to the one permission the check run below
      # needs, so nothing else the app is installed for is reachable from
      # this job. The step revokes the token when the job ends.
      - name: Mint a token for the security app
        id: app-token
        if: steps.credentials.outputs.available == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.GH_APP_SECURITY_APP_ID }}
          private-key: ${{ secrets.GH_APP_SECURITY_PRIVATE_KEY }}
          permission-checks: write

      # A check run, not a pull request comment: a check run is attributed
      # to the app that created it, it can be made a required check in a
      # ruleset, and it carries the full report as its own output. A
      # comment would notify every subscriber of the pull request again
      # for each push.
      #
      # "POST /check-runs" always creates a new check run; nothing here
      # looks up or PATCHes an existing one. In the common case that still
      # reads as one check run per push, because each push produces a new
      # head SHA and GitHub scopes check runs per SHA. A "reopened" event,
      # which this workflow's caller typically triggers on through its own
      # "pull_request" trigger, or a manual re-run against the same head
      # SHA, instead POSTs a second, duplicate check run for that commit
      # rather than replacing the first. That duplicate-run case is a
      # known edge case this step does not handle.
      - name: Publish the result as the security app's check run
        if: steps.credentials.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONCLUSION: ${{ steps.dco.outputs.conclusion }}
        run: |
          if [ "${CONCLUSION}" = "success" ]; then
            title="Every commit is signed off"
          else
            title="A commit is missing its sign-off"
          fi

          jq -n \
            --arg head_sha "${HEAD_SHA}" \
            --arg conclusion "${CONCLUSION}" \
            --arg title "${title}" \
            --rawfile summary "${RUNNER_TEMP}/dco.md" \
            '{
              name: "DCO",
              head_sha: $head_sha,
              status: "completed",
              conclusion: $conclusion,
              output: {title: $title, summary: $summary},
            }' |
            gh api --method POST "repos/${REPO}/check-runs" --input -

      - name: Fail the job when a commit lacks a sign-off
        if: steps.dco.outputs.conclusion == 'failure'
        run: |
          echo "a commit in this pull request lacks a valid DCO sign-off," \
            "see the step summary or the DCO check run" >&2
          exit 1
