version: "3"

tasks:
  setup:
    desc: Install the pinned toolchain
    cmds:
      - mise trust
      - mise install

  lint:actions:
    desc: GitHub Actions workflow lint
    cmds:
      - actionlint

  lint:yaml:
    desc: YAML lint
    cmds:
      - yamllint .

  lint:markdown:
    desc: Markdown lint
    cmds:
      - markdownlint-cli2 "**/*.md"

  lint:secrets:
    desc: Secret scan over the git history
    cmds:
      - gitleaks git --no-banner --redact

  lint:shell:
    desc: Shell script lint for this repository's CI scripts and the scripts of its actions
    cmds:
      - shellcheck scripts/*.sh .github/actions/*/*.sh

  lint:license:
    desc: License header check for every shell script
    cmds:
      - addlicense -check -c "Simon Ostendorf" -y 2026 -l apache -s=only scripts/*.sh .github/actions/*/*.sh

  # Shared with other repositories through a remote include. Settings come from
  # CLI variables or the environment (ROOT_LIMIT, NESTED_LIMIT, MODE), never from
  # vars on the include. The dir is the caller's, not the included Taskfile's.
  lint:agents-md:
    desc: AGENTS.md line limits, ROOT_LIMIT 150, NESTED_LIMIT 100, MODE warn or fail
    dir: "{{.USER_WORKING_DIR}}"
    silent: true
    vars:
      ROOT: '{{default (env "ROOT_LIMIT" | default "150") .ROOT_LIMIT}}'
      NESTED: '{{default (env "NESTED_LIMIT" | default "100") .NESTED_LIMIT}}'
      MODE_VALUE: '{{default (env "MODE" | default "warn") .MODE}}'
    cmds:
      - |
        over=0
        skip='-name node_modules -o -name .git -o -name vendor -o -path ./.claude/worktrees'
        export ROOT={{.ROOT}} NESTED={{.NESTED}} LABEL={{if eq .MODE_VALUE "fail"}}error{{else}}warning{{end}}
        find . \( $skip \) -prune -o -name AGENTS.md -type f -exec sh -c '
          rc=0
          for f; do
            limit=$NESTED
            [ "$f" = ./AGENTS.md ] && limit=$ROOT
            lines=$(awk "END{print NR}" "$f")
            if [ "$lines" -gt "$limit" ]; then
              echo "$LABEL: $f has $lines lines, the limit is $limit"
              rc=1
            fi
          done
          exit $rc' sh {} + || over=1
        [ "$over" = 0 ] || [ "{{.MODE_VALUE}}" != fail ]

  test:shell:
    desc: Shell script tests for this repository's CI scripts and the scripts of its actions
    cmds:
      - scripts/check-dco_test.sh
      - scripts/reusable-license_test.sh
      - scripts/reusable-renovate-config_test.sh
      - scripts/pnpm-release-age-comment_test.sh
      - scripts/pnpm-release-age-comment-action_test.sh
      - scripts/reusable-renovate-automerge_test.sh
      - scripts/reusable-renovate-guard_test.sh
      - scripts/renovate-post-upgrade_test.sh
      - scripts/lint-agents-md_test.sh

  check:
    desc: Every check, one after another
    cmds:
      - task: lint:actions
      - task: lint:yaml
      - task: lint:markdown
      - task: lint:shell
      - task: lint:license
      - task: lint:agents-md
      - task: lint:secrets
      - task: test:shell
