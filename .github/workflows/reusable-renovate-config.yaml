name: reusable-renovate-config

# Validates a caller's Renovate configuration two different ways, so a
# malformed config or an unresolvable preset fails in CI instead of only
# surfacing later as a bot-filed "Action Required: Fix Renovate
# Configuration" issue once the hosted Renovate app actually runs. The
# first step runs Renovate's own "renovate-config-validator", which
# catches schema and type problems fast and with zero network access.
# The second step runs the real "renovate" binary itself with
# "--platform=local --config-validation-error", which actually resolves
# "extends" into the presets it names, catching the one mistake the
# first step cannot see.
#
# What this catches: invalid JSON/JSON5, an unknown top-level option, an
# option of the wrong type, and, with "strict" enabled, a deprecated
# option that still works but needs migrating, all from the first,
# "renovate-config-validator" step. Also a missing config: on its own,
# "renovate-config-validator" warns and exits 0 when no config file
# exists at any of its default locations (confirmed empirically against
# an empty directory: "WARN: No files to perform configuration
# validation against", exit 0), which is the same silent-failure shape
# this workflow exists to prevent, so the validate step below treats
# that warning as a hard failure instead of trusting the validator's own
# exit code.
#
# The second step then catches what the first cannot: a preset named in
# "extends" that does not exist. Running the real "renovate" binary with
# "--platform=local" treats the already checked-out working directory as
# the one and only repository to process, with no clone, no login and no
# write, which is why it needs no token and no other platform credential
# to actually resolve a preset reference, bundled/shorthand ones
# included. Confirmed empirically: a config extending
# "config:recommended" and the nonexistent ":pinDigests" fails with
# "Cannot find preset's package (:pinDigests)" and exit code 1, the same
# config with only "config:recommended" passes with exit code 0, and
# "renovate-config-validator" still passes on that same clean config too.
# "--platform=local" alone is not enough: without
# "--config-validation-error" the identical ":pinDigests" run logs the
# same error but exits 0 at the shell level, so the flag is required or
# this step would silently always pass. A preset reference addressed
# through a platform-hosted shorthand such as "github>org/repo" is
# resolved too, not only bundled ones: confirmed empirically with a
# "github>" preset pointing at a deliberately nonexistent organisation
# and repository, which made a real, unauthenticated HTTPS request to
# the GitHub contents API
# ("GET https://api.github.com/repos/.../contents/default.json", 404 Not
# Found, about 220ms per request) and then failed the same way, with
# exit code 1, in under two seconds total. GitHub's contents API serves
# public repository content to unauthenticated requests, which is why no
# token was needed for that request to resolve for real instead of
# hanging or silently skipping. Not every platform-hosted shorthand
# resolves this way, though: see "local>" just below.
#
# What this does NOT catch: a preset addressed with "local>org/repo",
# Renovate's own shorthand for a preset hosted in the org/repo running
# the current job, even when that repository is public and the preset
# itself is perfectly valid. "--platform=local" makes "local" itself the
# platform a preset resolves against, and Renovate has no local-preset
# implementation for that platform, full stop: confirmed empirically
# against "local>ostendorf-cloud/workflows", a real, public repository
# with a real "renovate.json", which fails with "Preset caused
# unexpected error (local>ostendorf-cloud/workflows)" and, at
# LOG_LEVEL=debug, the actual cause, "The platform you're using (local)
# does not support local presets." This is structural to
# "--platform=local" itself, unlike the private, credential-gated case
# below: no token, for a public or a private repository, would change
# it. A caller whose config addresses this organisation's own shared
# preset with "local>org/repo" should use "github>org/repo" instead,
# which resolves through the path this step actually supports.
#
# Also not caught: a preset hosted in a private, credential-
# gated remote source. The same unauthenticated GitHub contents API
# request described above returns the same 404 Not Found for a private
# repository it cannot read as it does for one that genuinely does not
# exist, so this step fails a caller's config that extends a real,
# private preset exactly as if the name were a typo: "Cannot find
# preset's package", exit code 1. That failure is the same fail-closed
# shape as every other case here, never a hang and never a silent pass,
# but it is a real "not supported" case rather than a bug: this workflow
# does not accept a platform token, deliberately, because nothing
# observed while building it needs one, and adding one "just in case"
# would hand every caller a reason to pass a token it mostly will not
# use. A caller who genuinely needs a private, token-gated preset
# resolved is out of scope for now. Also still out of scope, unchanged
# from before: the known, acknowledged gap upstream in
# "renovate-config-validator" itself (for example
# renovatebot/renovate#42501 and FlowMatrix-AI/renovate-config #36),
# whose "parsePreset" step only checks a preset reference's syntax,
# never whether it resolves to anything, which is exactly why the second
# step exists. The first step still earns its keep even after the second
# one exists: it is instant and has zero network dependency, so it keeps
# validating schema and type problems for a caller even if the network
# path to a preset registry is ever flaky or unreachable from the
# runner, a case the second step cannot tell apart from a genuinely bad
# preset.
#
# Inputs:
#   runs-on-runner: the runner label the job runs on, default
#     ubuntu-latest. A typed input rather than a hardcoded
#     "ubuntu-latest", because different consuming repositories may want
#     a different runner (self-hosted, a different OS, a different
#     size), and hardcoding one would force every consumer onto the same
#     choice forever.
#
#   renovate-version: the "renovate" npm package version this workflow
#     validates against, default "44.238.0" (the latest release at the
#     time this workflow was written). Used for both steps below, the
#     "renovate-config-validator" step and the "renovate --platform=local"
#     step, since both binaries ship from the same npm package. Pinned
#     here, inside this reusable workflow, rather than left to whatever
#     the calling repository's own mise.toml does or does not pin, for
#     the same reason
#     reusable-license.yaml pins addlicense: the check should run on a
#     known version regardless of the caller. A caller overriding this to
#     a version whose validator changes the exact warning text the
#     missing-config check greps for would silently lose that one check;
#     bumping the default here is the safer way to move this workflow
#     forward.
#
#   strict: whether to append "--strict" to the validator, default false.
#     "--strict" also fails on a deprecated-but-still-working option that
#     needs migrating, a softer problem than a hard validation error.
#     Left off by default so this workflow fails only on an actual
#     error, matching the bug it was written to catch; a caller can opt
#     into the stricter check once ready for it.
#
# Installing renovate:
#   renovate is installed through mise's own "npm:renovate" backend, the
#   same shape reusable-license.yaml uses for "aqua:google/addlicense":
#   pinned here, inside this reusable workflow, through an inline
#   mise.toml, independent of whatever the calling repository's own
#   mise.toml does or does not pin.
#
#   That backend ("aube") also runs a supply-chain trust check while
#   resolving dependencies, and renovate's own dependency tree currently
#   trips it: a transitive dependency, "@yarnpkg/libzip@3.2.2", carries
#   no provenance attestation where its predecessor, 3.2.1, had one (as
#   did 3.2.1's own predecessor, 3.2.0, the baseline mise's own error
#   message names), and mise's default trust policy refuses that kind
#   of trust downgrade. The inline mise.toml below exempts exactly that
#   package at exactly that version through "trust_policy_excludes",
#   not the bare package name, so a future @yarnpkg/libzip release is
#   checked again rather than silently exempted too.
#
#   Checking the npm registry metadata for 3.2.1 and 3.2.2 found no sign
#   of tampering. 3.2.2's "gitHead" is a real, public commit in
#   yarnpkg/berry, titled "Releasing 16 new packages", that itself bumps
#   "@yarnpkg/libzip" to 3.2.2 and was authored by the project's own
#   release bot the same day as the npm publish: the tarball matches the
#   ordinary automated release, only the "npm publish" step ran outside
#   the attested CI flow that produced 3.2.1. That publish came from a
#   different npm account, "arcanis" rather than 3.2.1's "yarnbot", but
#   both publish as the same person: "arcanis" publishes as
#   "nison.mael@gmail.com", "yarnbot" as the plus-addressed
#   "nison.mael+yarnbot.npm@gmail.com". A manual publish of a normal
#   release by that release's own maintainer, not a different, unknown
#   party.
on:
  workflow_call:
    inputs:
      runs-on-runner:
        description: Runner label the Renovate configuration check runs on.
        type: string
        default: ubuntu-latest
      renovate-version:
        description: Version of the "renovate" npm package to validate against.
        type: string
        default: "44.238.0"
      strict:
        description: >-
          Append "--strict" to renovate-config-validator, so a deprecated option
          that still works but needs migrating also fails the job.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Renovate configuration is valid
    runs-on: ${{ inputs.runs-on-runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Pins renovate through an inline mise.toml independent of whatever
      # the calling repository's own mise.toml does or does not pin. The
      # "trust_policy_excludes" entry exempts exactly one known,
      # investigated transitive dependency from mise's npm-backend
      # supply-chain trust check: see the "Installing renovate" comment
      # above for why it is there and why it is scoped this narrowly.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
        with:
          mise_toml: |
            [tools."npm:renovate"]
            version = "${{ inputs.renovate-version }}"
            trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"]

      # "renovate-config-validator" exits 0 and only warns when no config
      # file exists at any of its default locations, see the "What this
      # catches" comment above, so that warning is treated as a failure
      # here rather than trusting the validator's own exit code alone.
      - name: Validate the Renovate configuration
        env:
          STRICT: ${{ inputs.strict }}
        run: |
          args=()
          if [ "${STRICT}" = "true" ]; then
            args+=(--strict)
          fi

          code=0
          output="$(renovate-config-validator "${args[@]}" 2>&1)" || code=$?
          printf '%s\n' "${output}"

          if printf '%s\n' "${output}" |
            grep -qF "No files to perform configuration validation against"; then
            echo "no Renovate configuration file was found at any of its" \
              "default locations" >&2
            exit 1
          fi

          exit "${code}"

      # The step above never resolves "extends" into the presets it
      # names, see the "What this catches" comment above. This step
      # does, by running the real "renovate" binary itself instead of
      # its validator, against the working directory that
      # "actions/checkout" already checked out earlier in this job.
      # "--platform=local" treats that working directory as the one and
      # only repository to process, with no clone, no login and no write
      # (confirmed empirically: every action it would otherwise take is
      # instead logged as "DRY-RUN: Would ..."), which is why no token
      # or other platform credential is configured here.
      # "--config-validation-error" is required alongside it:
      # "--platform=local" alone logs an unresolved preset as an error
      # but still exits 0 at the shell level (confirmed empirically
      # against the same config: identical log output, exit code 0
      # without the flag, exit code 1 with it), so without it this step
      # would silently always pass. A missing config file is not
      # re-checked here: on its own this command exits 0 and proceeds
      # into a dry-run onboarding flow when no config file exists
      # (confirmed empirically against an empty directory), but the
      # step above has already hard-failed and stopped the job before
      # this one runs in that case, so it never actually has to handle
      # it.
      - name: Resolve the Renovate configuration's presets
        run: |
          code=0
          output="$(renovate --platform=local --config-validation-error 2>&1)" || code=$?
          printf '%s\n' "${output}"
          exit "${code}"
