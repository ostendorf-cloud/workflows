name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref. A superseded push to a pull request cancels the run it
# replaced; a push to main keeps every run, so the default branch has an
# unbroken check record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
      - run: task lint:actions

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
      - run: task lint:yaml

  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
      - run: task lint:markdown

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
      - run: task lint:secrets

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
      - run: task lint:shell

  license:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
      - run: task lint:license

  agents-md:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
      - run: task lint:agents-md MODE=fail

  shell-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
      - run: task test:shell

  # Dogfooding: validates this repository's own renovate.json with the
  # same reusable workflow it publishes for every other repository to
  # call, the same local "uses:" self-call "dco.yaml" and "renovate.yaml"
  # already use for "reusable-dco.yaml" and "reusable-renovate.yaml".
  # Before this job existed, nothing in this repository ever ran
  # "reusable-renovate-config.yaml" on itself, which is why a Node
  # version bug in it reached four consumer repositories before this
  # repository's own CI caught anything.
  #
  # "extra-files" names "default.json", the shared Renovate preset this
  # repository publishes for every other repository to extend, and the
  # opt in preset "govue-lockfile.json":
  # "renovate-config-validator" never scans for them on its own, so without
  # this they would ship unvalidated. "renovate.json" is deliberately not
  # named: the reusable workflow always runs the validator bare first, so
  # auto-discovery checks it anyway, and through the stricter of the two
  # forms.
  #
  # "preset-files" also names both files, so a preset in their own
  # "extends" that does not exist fails here, against the version under
  # review, instead of in every repository that extends it.
  renovate-config:
    uses: ./.github/workflows/reusable-renovate-config.yaml
    with:
      extra-files: default.json govue-lockfile.json
      preset-files: default.json govue-lockfile.json
